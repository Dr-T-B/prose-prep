name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test
      - name: Run lint
        run: npm run lint
      - name: Validate Component 2 AO contract
        run: npm run validate:component2-ao
      - name: Check browser source for LLM secrets
        run: npm run check:no-client-llm
      - name: Check whitespace errors
        run: git diff --check
      - name: Run focused post-merge tests
        run: npm run test -- src/pages/ParagraphFeedback.test.tsx src/lib/paragraphFeedbackContract.test.ts src/pages/RapidRecall.test.tsx src/App.test.tsx src/components/AppShell.test.tsx

  integration-test:
    name: Integration tests (live Supabase)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    env:
      INTEGRATION: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.INTEGRATION_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.INTEGRATION_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: |
          npx vitest run \
            src/lib/__tests__/planRepository.integration.test.ts \
            --reporter=verbose
